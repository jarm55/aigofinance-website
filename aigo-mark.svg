<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="300" height="300" role="img" aria-labelledby="title">
  <title id="title">Símbolo A de Aigo Finance</title>
  <defs>
    <linearGradient id="azulAigo" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0%" stop-color="#06449E"/>
      <stop offset="48%" stop-color="#075CB7"/>
      <stop offset="100%" stop-color="#159FD4"/>
    </linearGradient>
  </defs>

  <!-- Silueta continua: dos piernas regulares, con hueco y travesaño legibles. -->
  <path d="M70 770 405 85 Q430 38 450 38 Q470 38 495 85 L830 770 H635 L450 365 265 770Z"
        fill="url(#azulAigo)"/>

  <!-- Travesaño ancho y recto para que la A conserve su lectura en tamaños pequeños. -->
  <path d="M320 610 365 505H535L580 610Z" fill="url(#azulAigo)"/>
</svg>
